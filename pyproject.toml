[project]
name = "geometor-euler"
dynamic = ["version"]
authors = [
  { name = "phiarchitect", email = "github@geometor.com" },
]
description = "the Swiss mathematician whose 1765 memoir discovered the Euler line connecting the orthocenter, centroid, and circumcenter of every triangle"
readme = "README.rst"
requires-python = ">=3.13"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy",
    "rich",
    "geometor-model",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
euler = "geometor.euler.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "geometor.euler.__version__" }

[project.urls]
"Website" = "https://geometor.github.io/euler"
"Repository" = "https://github.com/geometor/euler"
"Issues" = "https://github.com/geometor/euler/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "demos"]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
